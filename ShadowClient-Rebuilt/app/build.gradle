plugins {
    id 'com.android.application'
}

android {
    namespace 'com.happproxy'
    compileSdk 36

    defaultConfig {
        applicationId "com.happproxy"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "4.2.1-SHADOW" // bump from 4.2.0 after password patch
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a' // original APK was arm64 only
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug // use debug keystore for easy reinstall over original
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // keep original SOs untouched — server remains
            // libgojni.so (16.5M) and libhappcore.so (1.1M) from original APK
            // are placed in app/src/main/jniLibs/arm64-v8a/
            useLegacyPackaging true
        }
    }

    // Allow LSPosed-obfuscated strings to remain — don't re-obfuscate
    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:1.12.0'
    implementation 'androidx.core:core:1.12.0'
    // json is built-in via org.json
}

// Task to verify server preservation
tasks.register('checkServer') {
    doLast {
        println "Checking server preserved in jniLibs..."
        def soFile = file('src/main/jniLibs/arm64-v8a/libgojni.so')
        if (soFile.exists()) {
            println "libgojni.so present: ${soFile.length()/1024/1024} MB — server intact"
        } else {
            throw new GradleException("Missing libgojni.so — copy from ../dripclient-wire-v4.2.0.apk")
        }
    }
}
preBuild.dependsOn checkServer
